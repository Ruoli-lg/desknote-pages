<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E7">
<title>桌面便签 · 网页版</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="appbar">
  <div class="brand">
    <div class="logo">便</div>
    <div>
      <h1 id="app-title">桌面便签</h1>
      <div id="sync-status" class="status">未连接</div>
    </div>
  </div>
  <div class="actions">
    <button id="sync-btn" class="icon-btn" title="立即同步">同步</button>
    <button id="config-btn" class="icon-btn" title="同步设置">设置</button>
  </div>
</header>

<main class="shell">
  <nav id="page-tabs" class="page-tabs" aria-label="页面"></nav>
  <section id="note-panel" class="note-panel hidden">
    <div class="note-head">
      <div>
        <h2 id="note-title">便签</h2>
        <p class="muted">网页版只读显示桌面端正文，避免破坏排版与图片。</p>
      </div>
    </div>
    <iframe id="note-frame" sandbox="" title="便签正文"></iframe>
  </section>

  <section id="task-panel" class="task-panel">
    <div class="toolbar">
      <div id="filters" class="filters">
        <button data-filter="pending" class="active">待办 <span id="count-pending">0</span></button>
        <button data-filter="done">已完成 <span id="count-done">0</span></button>
        <button data-filter="deleted">已删除 <span id="count-deleted">0</span></button>
      </div>
    </div>
    <div id="empty" class="empty hidden">这里还没有事项。</div>
    <ul id="task-list" class="task-list"></ul>
  </section>
</main>

<form id="add-form" class="addbar">
  <input id="new-text" maxlength="500" autocomplete="off" placeholder="写一条待办…">
  <select id="new-page" aria-label="所属页面"></select>
  <button type="submit">添加</button>
</form>

<div id="drawer-mask" class="mask hidden"></div>
<aside id="drawer" class="drawer" aria-label="云同步设置">
  <div class="drawer-head">
    <h2>云同步设置</h2>
    <button id="close-drawer" class="icon-btn">关闭</button>
  </div>
  <p class="muted">接口和网页使用同一个 Pages 域名时，地址留空即可。密钥只保存在本机浏览器。</p>
  <label class="field">接口地址（留空即当前网页）
    <input id="endpoint-input" type="url" placeholder="https://desknote-web.xxx.pages.dev">
  </label>
  <label class="field">同步密钥
    <input id="token-input" type="password" placeholder="AUTH_TOKEN">
  </label>
  <div class="drawer-actions">
    <button id="save-config" class="primary">保存并连接</button>
    <button id="clear-config">清除本机配置</button>
  </div>
  <p class="hint">地址不要带 `/api/workspace`，程序会自动补。密钥错误会提示 401。</p>
</aside>

<div id="toast" class="toast hidden"></div>
<script src="./app.js"></script>
</body>
</html>
